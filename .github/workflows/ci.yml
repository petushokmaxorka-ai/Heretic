name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Desktop typecheck + build
        working-directory: desktop
        run: |
          npm ci
          npm run typecheck
          npm run build

  smoke:
    # Pinned: the apt package names below are the 24.04 (t64) ones.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: xvfb + electron smoke
        working-directory: desktop
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0t64 libgtk-3-0t64 libasound2t64
          npm ci
          npm run build
          # Electron fetches its binary lazily; get it now so the sandbox helper can be fixed up.
          node node_modules/electron/install.js
          # 24.04 restricts unprivileged user namespaces (AppArmor), so Chromium falls back to the
          # SUID sandbox helper, which must be root-owned with mode 4755 or Electron aborts.
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          timeout 60 xvfb-run -a npx electron . --smoke
