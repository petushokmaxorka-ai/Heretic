<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>HERETIC</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <span class="brand">◆ HERETIC</span>
    <nav class="tabs">
      <button class="tab active" id="tab-chat">CHAT</button>
      <button class="tab" id="tab-agent">AGENT</button>
    </nav>
    <span id="brain-label" class="dim">brain: —</span>
    <span class="spacer"></span>
    <select id="trust" title="trust mode">
      <option value="manual">manual</option>
      <option value="auto">auto</option>
      <option value="dry">dry</option>
    </select>
    <button id="scan" class="ghost">scan brains</button>
  </header>

  <section class="brains" id="brains" hidden>
    <div class="dim small">local runtimes (guest protocol — we never spawn our own):</div>
    <div id="brain-list"></div>
    <div class="custom">
      <input id="c-url" placeholder="custom base url (http://127.0.0.1:11436/)" />
      <input id="c-model" placeholder="model id" />
      <input id="c-key" placeholder="api key (cloud)" type="password" />
    </div>
    <label class="council-toggle"><input type="checkbox" id="council" /> council — advisor debates, brain executes</label>
    <div class="custom" id="advisor-row" hidden>
      <input id="a-url" placeholder="advisor url (or echo)" />
      <input id="a-model" placeholder="advisor model" />
      <input id="a-key" placeholder="advisor key" type="password" />
    </div>
  </section>

  <section id="chatview" class="view">
    <main id="chatlog">
      <div class="dim small center" style="margin-top:40vh">спроси что угодно — организм ответит</div>
    </main>
    <footer>
      <select id="think" title="thinking level">
        <option value="low">low</option>
        <option value="mid" selected>mid</option>
        <option value="high">high</option>
        <option value="max">max</option>
      </select>
      <label class="webtoggle" title="observe decides automatically"><input type="checkbox" id="auto" checked /> observe</label>
      <label class="webtoggle"><input type="checkbox" id="web" /> web</label>
      <input id="chat-input" placeholder="спроси что угодно…" autocomplete="off" />
      <button id="send">SEND</button>
    </footer>
  </section>
  <section id="agentview" class="view hidden">
  <main id="ledger">
    <div class="dim small center" style="margin-top:40vh">the ledger is empty — give the organism a task</div>
  </main>

  <footer>
    <span class="glyph">⚙</span>
    <input id="task" placeholder='task… (@brain prefix routes)' autocomplete="off" />
    <button id="ignite">IGNITE</button>
  </footer>
  </section>

  <script type="module" src="main.ts"></script>
</body>
</html>
